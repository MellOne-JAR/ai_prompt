<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>프롬프트 아카이브</title>
    <meta
      name="description"
      content="이미지·디자인 프롬프트를 분류별로 탐색하고 한 번의 클릭으로 복사할 수 있는 단일 페이지 프롬프트 보관함"
    />
    <meta property="og:title" content="프롬프트 아카이브" />
    <meta
      property="og:description"
      content="이미지·디자인 프롬프트를 분류별로 탐색하고 한 번의 클릭으로 복사할 수 있는 단일 페이지 프롬프트 보관함"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-canvas: #fbf9f5;
        --bg-surface: #ffffff;
        --bg-subtle: #f3efe7;
        --border-hairline: #e4ddd0;
        --border-strong: #cfc5b4;
        --ink-primary: #1c1917;
        --ink-secondary: #57534e;
        --ink-muted: #78716c;
        --accent-primary: #9a3412;
        --accent-primary-hover: #7c2d12;
        --accent-soft: #fff4ed;
        --accent-lapis: #1e3a8a;
        --accent-forest: #14532d;
        --danger: #b91c1c;
        --danger-hover: #991b1b;
        --shadow-card: 0 1px 3px rgba(28, 25, 23, 0.04), 0 8px 24px rgba(28, 25, 23, 0.03);
        --shadow-modal: 0 24px 64px rgba(28, 25, 23, 0.18);
        --radius-lg: 14px;
        --radius-md: 10px;
        --radius-sm: 8px;
        --font-sans: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        --font-serif: "Noto Serif KR", Georgia, serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-canvas);
        color: var(--ink-primary);
        font-family: var(--font-sans);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      textarea,
      select {
        font-family: inherit;
      }

      .hidden {
        display: none !important;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }

      /* Top Header */
      .site-header {
        background-color: var(--bg-surface);
        border-bottom: 1px solid var(--border-hairline);
        position: sticky;
        top: 0;
        z-index: 20;
      }

      .header-inner {
        max-width: 1160px;
        margin: 0 auto;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
        flex-shrink: 0;
        text-decoration: none;
        color: var(--ink-primary);
      }

      .brand-emoji {
        font-size: 22px;
        line-height: 1;
      }

      .brand-title {
        font-family: var(--font-serif);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0;
      }

      .search-wrap {
        flex: 1 1 280px;
        max-width: 440px;
        position: relative;
        display: flex;
        align-items: center;
      }

      .search-icon {
        position: absolute;
        left: 14px;
        font-size: 15px;
        pointer-events: none;
        opacity: 0.75;
      }

      .search-input {
        width: 100%;
        height: 42px;
        padding: 0 38px 0 40px;
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-md);
        background-color: var(--bg-canvas);
        color: var(--ink-primary);
        font-size: 14px;
        transition: border-color 160ms ease, background-color 160ms ease;
      }

      .search-input::placeholder {
        color: var(--ink-muted);
      }

      .search-input:focus {
        outline: none;
        border-color: var(--accent-primary);
        background-color: var(--bg-surface);
      }

      .search-clear {
        position: absolute;
        right: 8px;
        width: 28px;
        height: 28px;
        border: none;
        background: transparent;
        color: var(--ink-muted);
        border-radius: 6px;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 14px;
      }

      .search-clear.visible {
        display: inline-flex;
      }

      .search-clear:hover {
        background-color: var(--bg-subtle);
        color: var(--ink-primary);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .btn-primary {
        height: 40px;
        padding: 0 16px;
        border: none;
        border-radius: var(--radius-md);
        background-color: var(--accent-primary);
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background-color 160ms ease, transform 120ms ease;
      }

      .btn-primary:hover:not(:disabled) {
        background-color: var(--accent-primary-hover);
      }

      .btn-primary:active:not(:disabled) {
        transform: translateY(1px);
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .btn-secondary {
        height: 40px;
        padding: 0 15px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        background-color: var(--bg-surface);
        color: var(--ink-primary);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background-color 150ms ease, border-color 150ms ease;
      }

      .btn-secondary:hover:not(:disabled) {
        background-color: var(--bg-subtle);
        border-color: var(--ink-secondary);
      }

      .btn-danger {
        height: 38px;
        padding: 0 14px;
        border: 1px solid #fecaca;
        border-radius: var(--radius-sm);
        background-color: #fef2f2;
        color: var(--danger);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
      }

      .btn-danger:hover:not(:disabled) {
        background-color: var(--danger);
        border-color: var(--danger);
        color: #ffffff;
      }

      .btn-danger-solid {
        height: 40px;
        padding: 0 18px;
        border: none;
        border-radius: var(--radius-md);
        background-color: var(--danger);
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }

      .btn-danger-solid:hover:not(:disabled) {
        background-color: var(--danger-hover);
      }

      .btn-primary:focus-visible,
      .btn-secondary:focus-visible,
      .btn-danger:focus-visible,
      .btn-danger-solid:focus-visible,
      .filter-btn:focus-visible,
      .copy-btn:focus-visible,
      .close-btn:focus-visible {
        outline: 2px solid var(--accent-primary);
        outline-offset: 2px;
      }

      /* Main Container */
      .main-container {
        max-width: 1160px;
        margin: 0 auto;
        padding: 28px 24px 72px;
      }

      /* Auth Alert Banner */
      .notice-banner {
        background-color: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
        border-radius: var(--radius-md);
        padding: 12px 16px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 14px;
        font-weight: 500;
      }

      .notice-close {
        border: none;
        background: transparent;
        color: inherit;
        font-size: 15px;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 6px;
      }

      /* Admin Panel */
      .admin-panel {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        padding: 20px 24px;
        margin-bottom: 28px;
        box-shadow: var(--shadow-card);
      }

      .admin-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border-hairline);
      }

      .admin-panel-title-wrap {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .admin-panel-title {
        margin: 0;
        font-family: var(--font-serif);
        font-size: 18px;
        font-weight: 700;
        color: var(--ink-primary);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .admin-panel-sub {
        margin: 0;
        font-size: 13px;
        color: var(--ink-secondary);
      }

      .admin-panel-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .admin-list {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .admin-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 14px;
        background-color: var(--bg-canvas);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-md);
        flex-wrap: wrap;
      }

      .admin-row-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 220px;
        flex: 1 1 auto;
      }

      .admin-row-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--ink-primary);
      }

      .admin-row-meta {
        font-size: 12px;
        color: var(--ink-muted);
      }

      .admin-row-btns {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      /* Intro & Category Bar */
      .catalog-toolbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border-hairline);
        margin-bottom: 24px;
      }

      .toolbar-heading {
        margin: 0 0 6px;
        font-family: var(--font-serif);
        font-size: clamp(22px, 2.6vw, 28px);
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--ink-primary);
      }

      .toolbar-sub {
        margin: 0;
        font-size: 14px;
        color: var(--ink-secondary);
      }

      .filter-group {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px;
        background-color: var(--bg-subtle);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-md);
        flex-wrap: wrap;
      }

      .filter-btn {
        min-height: 36px;
        padding: 6px 14px;
        border: none;
        border-radius: 7px;
        background: transparent;
        color: var(--ink-secondary);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background-color 150ms ease, color 150ms ease;
      }

      .filter-btn:hover {
        color: var(--ink-primary);
        background-color: rgba(255, 255, 255, 0.55);
      }

      .filter-btn.active {
        background-color: var(--bg-surface);
        color: var(--ink-primary);
        box-shadow: 0 1px 2px rgba(28, 25, 23, 0.08);
      }

      .results-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
        font-size: 13px;
        color: var(--ink-muted);
        font-variant-numeric: tabular-nums;
      }

      /* Card Grid */
      .prompt-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .prompt-card {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-lg);
        padding: 24px;
        box-shadow: var(--shadow-card);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 18px;
        cursor: pointer;
        transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1),
          border-color 160ms ease;
      }

      .prompt-card:hover {
        transform: translateY(-2px);
        border-color: var(--border-strong);
      }

      .card-top {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .card-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        color: var(--ink-muted);
      }

      .category-label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .category-label[data-cat="사진 합성"] {
        color: var(--accent-primary);
      }

      .category-label[data-cat="스타일 변환"] {
        color: var(--accent-lapis);
      }

      .category-label[data-cat="캐릭터·포스터"] {
        color: var(--accent-forest);
      }

      .card-index {
        font-variant-numeric: tabular-nums;
        color: var(--ink-muted);
      }

      .card-title {
        margin: 0;
        font-family: var(--font-serif);
        font-size: 19px;
        font-weight: 700;
        line-height: 1.35;
        color: var(--ink-primary);
        text-wrap: balance;
      }

      .card-preview {
        margin: 0;
        font-size: 14px;
        line-height: 1.65;
        color: var(--ink-secondary);
        white-space: pre-line;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
      }

      .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding-top: 14px;
        border-top: 1px solid var(--bg-subtle);
        flex-wrap: wrap;
      }

      .card-hint {
        font-size: 12px;
        color: var(--ink-muted);
      }

      .card-action-group {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }

      .copy-btn {
        min-height: 38px;
        padding: 7px 14px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background-color: var(--bg-canvas);
        color: var(--ink-primary);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
      }

      .copy-btn:hover {
        background-color: var(--bg-subtle);
        border-color: var(--ink-secondary);
      }

      .copy-btn.copied {
        background-color: var(--accent-forest);
        border-color: var(--accent-forest);
        color: #ffffff;
      }

      /* Empty State */
      .empty-state {
        grid-column: 1 / -1;
        background-color: var(--bg-surface);
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-lg);
        padding: 56px 24px;
        text-align: center;
      }

      .empty-emoji {
        font-size: 36px;
        margin-bottom: 12px;
        display: block;
      }

      .empty-title {
        margin: 0 0 6px;
        font-size: 17px;
        font-weight: 700;
        color: var(--ink-primary);
      }

      .empty-desc {
        margin: 0 0 18px;
        font-size: 14px;
        color: var(--ink-secondary);
      }

      /* Modal */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background-color: rgba(28, 25, 23, 0.54);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 50;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .modal-dialog {
        width: 100%;
        max-width: 760px;
        max-height: 88vh;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-modal);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: modalIn 160ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .modal-dialog.modal-sm {
        max-width: 440px;
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .modal-header {
        padding: 20px 26px 16px;
        border-bottom: 1px solid var(--border-hairline);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        flex-shrink: 0;
      }

      .modal-title-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .modal-meta-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--ink-muted);
      }

      .modal-title {
        margin: 0;
        font-family: var(--font-serif);
        font-size: 21px;
        font-weight: 700;
        line-height: 1.35;
        color: var(--ink-primary);
      }

      .close-btn {
        width: 38px;
        height: 38px;
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-sm);
        background-color: var(--bg-canvas);
        color: var(--ink-secondary);
        font-size: 16px;
        cursor: pointer;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .close-btn:hover {
        background-color: var(--bg-subtle);
        color: var(--ink-primary);
      }

      .modal-body {
        padding: 24px 26px;
        overflow-y: auto;
        flex: 1 1 auto;
        background-color: var(--bg-canvas);
      }

      .modal-content-text {
        margin: 0;
        font-size: 15px;
        line-height: 1.8;
        color: var(--ink-primary);
        white-space: pre-wrap;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      .modal-footer {
        padding: 16px 26px;
        border-top: 1px solid var(--border-hairline);
        background-color: var(--bg-surface);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-shrink: 0;
      }

      .modal-char-count {
        font-size: 13px;
        color: var(--ink-muted);
        font-variant-numeric: tabular-nums;
      }

      .modal-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* Form inside modal */
      .form-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-primary);
      }

      .field-control,
      .field-textarea {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background-color: var(--bg-surface);
        color: var(--ink-primary);
        font-size: 14px;
        line-height: 1.5;
      }

      .field-control:focus,
      .field-textarea:focus {
        outline: none;
        border-color: var(--accent-primary);
      }

      .field-textarea {
        min-height: 340px;
        resize: vertical;
        line-height: 1.75;
      }

      .form-error {
        margin: 0;
        font-size: 13px;
        color: var(--danger);
        font-weight: 500;
        display: none;
      }

      .form-error.visible {
        display: block;
      }

      /* Confirm Modal Body */
      .confirm-message {
        margin: 0;
        font-size: 15px;
        color: var(--ink-primary);
        line-height: 1.6;
      }

      .confirm-target {
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--ink-secondary);
        font-weight: 600;
      }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%) translateY(16px);
        background-color: var(--ink-primary);
        color: #ffffff;
        padding: 11px 20px;
        border-radius: var(--radius-md);
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 10px 30px rgba(28, 25, 23, 0.25);
        opacity: 0;
        pointer-events: none;
        z-index: 100;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: opacity 180ms ease, transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (max-width: 768px) {
        .header-inner {
          padding: 12px 16px;
          gap: 10px;
        }

        .search-wrap {
          order: 3;
          flex-basis: 100%;
          max-width: none;
        }

            if (Array.isArray(parsed) && parsed.length > 0) {

        return SAMPLE_PROMPTS.slice();

        authNoticeBanner.classList.add('hidden');

      function showToast(message) {
        toastMsgEl.textContent = message;
        toastEl.classList.add('show');

        toastTimer = setTimeout(() => {
          toastEl.classList.remove('show');
        }, 1800);
      }

      function formatDate(ms) {
        if (!ms) return '';
        const d = new Date(ms);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}.${m}.${day}`;
      }

      function getVisiblePrompts() {
        if (firestorePrompts.length > 0) {
          return firestorePrompts;
        }
        const dismissed = getDismissedSampleIds();
        // Display existing samples read-only if DB has none yet (never auto-saved)
        return loadLegacyReadOnlySamples().filter((item) => !dismissed.has(item.id));
      }

      function getFilteredPrompts() {
        const queryText = searchQuery.trim().toLowerCase();
        return getVisiblePrompts()
          .slice()
          .sort((a, b) => (a.createdAtMs || 0) - (b.createdAtMs || 0))
          .filter((item) => {
            const matchesCategory = activeCategory === '전체' || item.category === activeCategory;
            if (!matchesCategory) return false;
            if (!queryText) return true;
            return (
              (item.title || '').toLowerCase().includes(queryText) ||
              (item.content || '').toLowerCase().includes(queryText)
            );
          });
      }

      async function copyText(text, triggerButton) {
        let copied = false;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            copied = true;
          }
        } catch (err) {
          copied = false;
        }

        if (!copied) {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.top = '-9999px';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.select();
          try {
            copied = document.execCommand('copy');
          } catch (err) {
            copied = false;
          }
          document.body.removeChild(textarea);
        }

        if (copied) {
          showToast('복사됐어요!');
          if (triggerButton) {
            const originalHTML = triggerButton.innerHTML;
            triggerButton.classList.add('copied');
            triggerButton.innerHTML = '<span aria-hidden="true">✅</span><span>복사됨</span>';
            setTimeout(() => {
              triggerButton.classList.remove('copied');
              triggerButton.innerHTML = originalHTML;
            }, 1400);
          }
        } else {
          showToast('복사에 실패했어요. 내용을 직접 선택해 복사해 주세요.');
        }
      }

      function renderPrompts() {
        const items = getFilteredPrompts();

          resultsCount.textContent = `총 ${items.length}개의 프롬프트`;

        promptGrid.innerHTML = '';

        if (items.length === 0) {

        return msg.includes('permission-denied') || msg.includes('Missing or insufficient permissions');

      // Firebase Authentication (Google Sign-In Only)
      adminLoginBtn.addEventListener('click', async () => {
        hideNotice();
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        try {
          adminLoginBtn.disabled = true;
          await signInWithPopup(auth, provider);
        } catch (error) {
          if (error && error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
            showNotice('Google 로그인 중 문제가 발생했어요. 잠시 후 다시 시도해 주세요.');
          }
        } finally {
          adminLoginBtn.disabled = false;
        }
      });

      adminLogoutBtn.addEventListener('click', async () => {
        try {
          await signOut(auth);
          showToast('로그아웃됐어요.');
        } catch (error) {
          showNotice('로그아웃 중 오류가 발생했어요.');

      });

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          if (user.email === ADMIN_EMAIL && user.emailVerified) {
            isAdmin = true;
            isAdminMenuOpen = true;
            hideNotice();
            renderAll();
          } else {
            isAdmin = false;
            renderAll();
            showNotice('관리자만 사용할 수 있어요');
            showToast('관리자만 사용할 수 있어요');
            try {
              await signOut(auth);
            } catch (err) {
              console.error('Sign out error:', err);
            }
          }
        } else {
          isAdmin = false;
          closeEditorModal();
          closeDeleteConfirm();
          renderAll();
        }
      });

      // Firestore Real-Time Listener (Read-only for guests; never auto-writes)
      const promptsRef = collection(db, 'prompts');
      const promptsQuery = query(promptsRef, orderBy('createdAt', 'asc'));

      onSnapshot(
        promptsQuery,
        (snapshot) => {
          firestoreLoaded = true;
          firestorePrompts = snapshot.docs.map((docSnap) => {
            const data = docSnap.data();
            let createdAtMs = Date.now();
            if (data.createdAt && typeof data.createdAt.toMillis === 'function') {
              createdAtMs = data.createdAt.toMillis();
            } else if (typeof data.createdAt === 'number') {
              createdAtMs = data.createdAt;
            }
            return {
              id: docSnap.id,
              isSampleFallback: false,
              title: typeof data.title === 'string' ? data.title : '',
              category: ALLOWED_CATEGORIES.has(data.category) ? data.category : '사진 합성',
              content: typeof data.content === 'string' ? data.content : '',
              createdAtMs
            };
          });
          renderAll();
        },
        (error) => {
          handleFirestoreError(error, OperationType.LIST, 'prompts');
        }
      );

      // Admin Save / Update / Delete Handlers
      editorForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!isAdmin) {
          notifyAdminOnly();
          return;
        }

        const titleVal = editorTitle.value.trim();
        const categoryVal = editorCategory.value;
        const contentVal = editorContent.value;

        if (!titleVal) {
          editorFormError.textContent = '제목을 입력해 주세요.';
          editorFormError.classList.add('visible');
          editorTitle.focus();
          return;
        }
        if (titleVal.length > 100) {
          editorFormError.textContent = '제목은 100자 이하로 입력해 주세요.';
          editorFormError.classList.add('visible');
          editorTitle.focus();
          return;
        }
        if (!ALLOWED_CATEGORIES.has(categoryVal)) {
          editorFormError.textContent = '올바른 분류를 선택해 주세요.';
          editorFormError.classList.add('visible');
          return;
        }
        if (!contentVal.trim()) {
          editorFormError.textContent = '프롬프트 내용을 입력해 주세요.';
          editorFormError.classList.add('visible');
          editorContent.focus();
          return;
        }
        if (contentVal.length > 10000) {
          editorFormError.textContent = '내용은 10,000자 이하로 입력해 주세요.';
          editorFormError.classList.add('visible');
          editorContent.focus();
          return;
        }

        saveEditorBtn.disabled = true;
        editorFormError.classList.remove('visible');

        try {
          if (editingPromptId) {
            const docPath = `prompts/${editingPromptId}`;
            try {
              await updateDoc(doc(db, 'prompts', editingPromptId), {
                title: titleVal,
                category: categoryVal,
                content: contentVal
              });
              closeEditorModal();
              showToast('프롬프트가 수정됐어요!');
            } catch (err) {
              throw handleFirestoreError(err, OperationType.UPDATE, docPath);
            }
          } else {
            try {
              await addDoc(collection(db, 'prompts'), {
                title: titleVal,
                category: categoryVal,
                content: contentVal,
                createdAt: serverTimestamp()
              });
              closeEditorModal();
              showToast('프롬프트가 저장됐어요!');
            } catch (err) {
              throw handleFirestoreError(err, OperationType.CREATE, 'prompts');
            }
          }
        } catch (error) {
          if (isPermissionDeniedError(error)) {
            editorFormError.textContent = '관리자만 할 수 있어요';
            notifyAdminOnly();
          } else {
            editorFormError.textContent = '저장 중 오류가 발생했어요. 권한과 입력 내용을 확인해 주세요.';
          }
          editorFormError.classList.add('visible');
        } finally {
          saveEditorBtn.disabled = false;
        }
      });

      importSamplesBtn.addEventListener('click', async () => {
        if (!isAdmin) {
          notifyAdminOnly();
          return;
        }
        importSamplesBtn.disabled = true;
        try {
          saveDismissedSampleIds(new Set());
          const baseSamples = loadLegacyReadOnlySamples();
          for (let i = 0; i < baseSamples.length; i++) {
            const sample = baseSamples[i];
            const sampleId = `sample-${i + 1}`;
            try {
              await setDoc(doc(db, 'prompts', sampleId), {
                title: sample.title.slice(0, 100),
                category: ALLOWED_CATEGORIES.has(sample.category) ? sample.category : '사진 합성',
                content: sample.content.slice(0, 10000),
                createdAt: serverTimestamp()
              });
            } catch (err) {
              throw handleFirestoreError(err, OperationType.WRITE, `prompts/${sampleId}`);
            }
          }
          showToast('기존 샘플 4개가 DB에 저장됐어요!');
        } catch (error) {
          if (isPermissionDeniedError(error)) {
            notifyAdminOnly();
          } else {
            showNotice('샘플 저장 중 오류가 발생했어요.');
          }
        } finally {
          importSamplesBtn.disabled = false;
        }
      });

      confirmDeleteBtn.addEventListener('click', async () => {
        if (!isAdmin) {
          notifyAdminOnly();
          return;
        }
        if (!pendingDeleteItem) return;
        const targetItem = pendingDeleteItem;
        confirmDeleteBtn.disabled = true;
        try {
          if (targetItem.isSampleFallback) {
            const dismissed = getDismissedSampleIds();
            dismissed.add(targetItem.id);
            saveDismissedSampleIds(dismissed);
            closeDeleteConfirm();
            renderAll();
            showToast('프롬프트가 삭제됐어요!');
          } else {
            if (firestorePrompts.length <= 1) {
              const allSampleIds = new Set(loadLegacyReadOnlySamples().map((s) => s.id));
              saveDismissedSampleIds(allSampleIds);
            }
            await deleteDoc(doc(db, 'prompts', targetItem.id));
            closeDeleteConfirm();
            showToast('프롬프트가 삭제됐어요!');
          }
        } catch (error) {
          handleFirestoreError(error, OperationType.DELETE, `prompts/${targetItem.id}`);
          if (isPermissionDeniedError(error)) {
            notifyAdminOnly();
          } else {
            showNotice('삭제 중 오류가 발생했어요.');
          }
        } finally {
          confirmDeleteBtn.disabled = false;
        }
      });

      // UI Event Listeners
      toggleAdminMenuBtn.addEventListener('click', () => {
        isAdminMenuOpen = !isAdminMenuOpen;
        renderAdminUI();
      });

      openCreateBtn.addEventListener('click', openCreateModal);
      closeNoticeBtn.addEventListener('click', hideNotice);

      filterButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          setActiveCategory(btn.getAttribute('data-category'));
        });
      });

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        searchClearBtn.classList.toggle('visible', searchQuery.length > 0);
        renderPrompts();
      });

      searchClearBtn.addEventListener('click', () => {
        searchQuery = '';
        searchInput.value = '';
        searchClearBtn.classList.remove('visible');
        searchInput.focus();
        renderPrompts();
      });

      brandReset.addEventListener('click', (e) => {
        e.preventDefault();
        resetFilters();
      });

      closeDetailBtn.addEventListener('click', closeDetailModal);
      modalCloseFooterBtn.addEventListener('click', closeDetailModal);
      detailModal.addEventListener('click', (e) => {
        if (e.target === detailModal) closeDetailModal();
      });

      modalCopyBtn.addEventListener('click', () => {
        const item = getVisiblePrompts().find((p) => p.id === activeModalPromptId);
        if (item) copyText(item.content, modalCopyBtn);
      });

      closeEditorBtn.addEventListener('click', closeEditorModal);
      cancelEditorBtn.addEventListener('click', closeEditorModal);
      editorModal.addEventListener('click', (e) => {
        if (e.target === editorModal) closeEditorModal();
      });

      editorContent.addEventListener('input', () => {
        editorContentCount.textContent = `${editorContent.value.length.toLocaleString()}자`;
      });

      closeConfirmBtn.addEventListener('click', closeDeleteConfirm);
      cancelConfirmBtn.addEventListener('click', closeDeleteConfirm);
      confirmModal.addEventListener('click', (e) => {
        if (e.target === confirmModal) closeDeleteConfirm();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (confirmModal.classList.contains('open')) {
            closeDeleteConfirm();
          } else if (editorModal.classList.contains('open')) {
            closeEditorModal();
          } else if (detailModal.classList.contains('open')) {
            closeDetailModal();
          }
        }
      });

      renderAll();
    </script>
  </body>
</html>
